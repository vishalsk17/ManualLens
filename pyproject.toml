[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manuallens"
version = "0.1.0"
description = "Manual-grounded product assistance with verified page citations"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "pydantic>=2,<3", "anthropic>=0.49", "sentence-transformers>=3", "numpy>=1.26", "rank-bm25>=0.2.2", "pillow>=10", "streamlit>=1.40", "pandas>=2", "pyyaml>=6", "python-dotenv>=1", "tqdm>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]
faiss = ["faiss-cpu>=1.8"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"]

[project.scripts]
manualrag = "manualrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = "data/cache/pytest-state"
markers = ["integration: downloads or real model inference", "live: requires an API key"]
